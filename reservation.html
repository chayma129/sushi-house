<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Réservation – Sushi House</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>寿司 Sushi House</h1>
</header>

<nav class="prix-nav">
    <a href="index.html">Accueil</a>

    <a href="prix.html">Prix</a>
     
    <a href="#contact">Contact</a>
</nav>

<h2>Réserver une table</h2>

<form action="mailto:contact@sushi-house.example" method="post" >

  <p>
    <label for="nom">Nom et prénom :</label><br>
    <input type="text" id="nom" name="nom" placeholder="Votre nom et prénom" required>
  </p>

  <p>
    <label for="tel">Téléphone :</label><br>
    <input type="tel" id="tel" name="telephone" pattern="[2459][0-9]{7}" placeholder="+216" required>
  </p>

  <p>
    <label for="email">E-mail :</label><br>
    <input type="email" id="email" name="email" placeholder="nom@email.com" required>
  </p>

  <p>
    <label for="resto">Restaurant :</label><br>
    <select id="resto" name="restaurant" required>
      <option value="">-- Choisir --</option>
      <option>Restaurant 1</option>
      <option>Restaurant 2</option>
    </select>
  </p>

  <p>
    <label for="date">Date :</label><br>
    <input type="date" id="date" name="date" required>
  </p>

  <p>
    <label for="personnes">Nombre de personnes :</label><br>
    <input type="number" id="personnes" name="personnes" min="1" max="20" value="2" required>
  </p>

  <p>
    <label for="message">Message (allergies, demande particulière) :</label><br>
    <textarea id="message" name="message" rows="5" cols="40"></textarea>
  </p>

  <p><button type="submit">Envoyer ma demande</button></p>

</form>

<footer>
  <h2 id="contact">Contact</h2>
  <p>
    <a href="https://www.facebook.com/sushihouse" target="_blank" rel="noopener">Facebook</a>
    <a href="https://www.instagram.com/sushihouse" target="_blank" rel="noopener">Instagram</a>
  </p>
  <p>&copy; Sushi House - 2026</p>
</footer>

</body>
</html>
